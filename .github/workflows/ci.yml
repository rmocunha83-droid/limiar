name: CI

on:
  push:
    branches: [main, 'fix/**', 'codex/**']
  pull_request:

jobs:
  backend:
    name: Backend (testes + validação do catálogo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Sem lockfile no repo, npm install resolve as dependências declaradas.
      # Hoje os testes só importam módulos node:*, mas qualquer import futuro
      # de @vercel/blob num arquivo testado quebraria sem este passo.
      - name: Instala dependências
        run: npm install --no-audit --no-fund
      - name: Testes do backend de IA
        run: npm run test:ai-backend
      - name: Validação do catálogo de trechos
        run: python3 scripts/validate_passages.py

  ios:
    name: iOS (build em simulador)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build do app
        run: |
          xcodebuild -project Limiar.xcodeproj \
            -scheme Limiar \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
