name: CI

on:
  push:
    branches: [main, 'fix/**', 'codex/**']
  pull_request:

jobs:
  backend:
    name: Backend (testes + validação do catálogo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # O lockfile mantém a instalação reproduzível entre execuções do CI.
      - name: Instala dependências
        run: npm ci --no-audit --no-fund
      - name: Testes do backend de IA
        run: npm run test:ai-backend
      - name: Regressões do cache de narração
        run: node --test tests/narration-prewarm.test.js
      - name: Validação do catálogo de trechos
        run: python3 scripts/validate_passages.py
      - name: Regressões da expansão do catálogo
        run: python3 -m unittest discover -s scripts -p 'test_catalog_expansion.py'

  ios:
    name: iOS (build em simulador)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build do app
        run: |
          xcodebuild -project Limiar.xcodeproj \
            -scheme Limiar \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Testes iOS completos
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | ruby -rjson -e 'devices = JSON.parse(STDIN.read)["devices"].values.flatten; puts devices.find { |d| d["name"].start_with?("iPhone") }.fetch("udid")')
          xcodebuild test -project Limiar.xcodeproj \
            -scheme Limiar \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 120 \
            CODE_SIGNING_ALLOWED=NO
